name: PrivateJudgesWorkspace
options:
  bundleIdPrefix: com.privatejudges
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGNING_ALLOWED: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
  configs:
    Debug:
      ENABLE_TESTABILITY: YES

targets:
  PrivateJudgesWorkspace:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.privatejudges.workspace
        PRODUCT_NAME: "Private Judges Workspace"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Import images you choose for private judging sessions."
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Optional biometric unlock of the private judges workspace."
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: "NO"

  PrivateJudgesWorkspaceTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: PrivateJudgesWorkspace
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.privatejudges.workspace.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  PrivateJudgesWorkspace:
    build:
      targets:
        PrivateJudgesWorkspace: all
        PrivateJudgesWorkspaceTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PrivateJudgesWorkspaceTests
    archive:
      config: Release
